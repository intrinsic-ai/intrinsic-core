edition = "2023";

package intrinsic_proto.frontend.v1;

option go_package = "github.com/intrinsic-ai/insrc/incode/frontend/cloud/api/v1/clustermanager_api_go_proto";
option features.field_presence = IMPLICIT;

message ExportClusterMigrationStateRequest {
  string cluster_name = 1;
}

message ExportClusterMigrationStateResponse {
  string cluster_name = 1;
  string display_name = 2;
  string region = 3;
  string location = 4;
  bool can_do_real = 5;
  bool has_gpu = 6;
  string public_key = 7;
  string os_version = 8;
  string base_version = 9;
  string update_mode = 10;
}

message StageClusterMigrationRequest {
  ExportClusterMigrationStateResponse state = 1;
  string user_email = 3;
  bool private_device = 4;
  bool preserve_versions = 5;
}

message StageClusterMigrationResponse {
  bytes datasilo_info_json = 1;
}

message PrepareOnPremMigrationRequest {
  string cluster_name = 1;
  string target_project = 2;
  string target_organization_id = 3;
  bytes datasilo_info_json = 4;
}

message PrepareOnPremMigrationResponse {}

message AbortClusterMigrationRequest {
  string cluster_name = 1;
}

message AbortClusterMigrationResponse {}

message FinalizeClusterMigrationRequest {
  string cluster_name = 1;
}

message FinalizeClusterMigrationResponse {}
