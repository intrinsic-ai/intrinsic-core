// Request message for `SchedulePlatformUpdate`.
message SchedulePlatformUpdateRequest {
  reserved 1, 2;
  reserved project, org;

  // The unique identifier of the cluster to update.
  string cluster_id = 3 [(google.api.field_behavior) = REQUIRED];

  // The type of update to perform.
  enum UpdateType {
    // Unspecified update type. This is invalid and will result in an error.
    UPDATE_TYPE_UNSPECIFIED = 0;
    // Update to the latest available recommended versions.
    UPDATE_TYPE_FORWARD = 1;
    // Rollback to the previous version if available.
    UPDATE_TYPE_ROLLBACK = 2;
    // Update to specific versions specified in the `versions` field.
    // The system will validate that the target versions are compatible.
    UPDATE_TYPE_VERSIONED = 3;
    // Update to specific versions specified in the `versions` field without
    // compatibility checks. Use with caution.
    UPDATE_TYPE_VERSIONED_UNCHECKED = 4;
    // Clear the active solution from the cluster.
    UPDATE_TYPE_CLEAR_SOLUTION = 5;
  }

  // The type of update to execute.
  UpdateType update_type = 4 [(google.api.field_behavior) = REQUIRED];

  // The specific versions to update to.
  // This field MUST be set if `update_type` is `UPDATE_TYPE_VERSIONED` or
  // `UPDATE_TYPE_VERSIONED_UNCHECKED`. It is ignored for other update types.
  UpdateVersions versions = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `SchedulePlatformUpdate`.
message SchedulePlatformUpdateResponse {
  // The name of the long-running operation representing the update.
  // This name can be passed to the `google.longrunning.Operations` service
  // to poll for status or receive notifications of completion.
  // The format of the name will be "operations/{operation_id}".
  string operation_name = 1;
}

// Request message for `ClearUpdateFault`.
message ClearUpdateFaultRequest {
  // The unique identifier of the cluster to clear the update fault for.
  string cluster_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for `ClearUpdateFault`.
message ClearUpdateFaultResponse {}

