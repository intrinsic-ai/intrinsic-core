// This message is shared between the CreateCluster and AddDevice RPCs.
// It describes the device that needs to be registered during the operation.
message PendingDeviceDescription {
  // EITHER the device ID (typically node-$UUID) of the device that needs to be
  // registered OR a partial ID, specifically the last 12 characters of the
  // device ID.
  //
  // If the device has previously been registered with inctl and reset, the
  // device ID may have been overridden to match the hostname (eg lab-bb-01).
  //
  // In the Portal UI, it's described as "Device ID".
  // In the IPC UI, the partial ID is described as "Registration Code".
  string device_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateClusterInfo {
  PendingDeviceDescription pending = 1 [(google.api.field_behavior) = REQUIRED];
  // EITHER a globally unique cluster identifier
  // OR a partial ID, specifically the last 12 characters of the device ID
  // ("node-<UUID>").
  //
  // If a partial ID is used, the cluster ID will be set to the device ID
  // ("node-<UUID>").
  //
  // The network hostname of the control plane node will be set to match the
  // cluster ID.
  string cluster_id = 2 [(google.api.field_behavior) = REQUIRED];
  string region = 3 [(google.api.field_behavior) = OPTIONAL];
  // Set to true, to automatically delete an old cluster on collision.
  bool replace = 4 [(google.api.field_behavior) = OPTIONAL];
  // Set to true, to hide the cluster from other people in the org.
  bool private_device = 5 [(google.api.field_behavior) = OPTIONAL];
  // The name of the cluster for humans
  string display_name = 6 [(google.api.field_behavior) = REQUIRED];
  string location = 7 [(google.api.field_behavior) = OPTIONAL];

  // The update mode to select.
  PlatformUpdateMode update_mode = 8 [(google.api.field_behavior) = OPTIONAL];

  // The versions to install.
  UpdateVersions versions = 9 [(google.api.field_behavior) = OPTIONAL];
}

