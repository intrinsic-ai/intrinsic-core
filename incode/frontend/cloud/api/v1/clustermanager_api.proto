  CreateClusterInfo cluster_info = 3 [(google.api.field_behavior) = REQUIRED];
  bool preserve_versions = 4 [(google.api.field_behavior) = OPTIONAL];
  string copy_cluster = 5 [(google.api.field_behavior) = OPTIONAL];
}

message CreateClusterResponse {}

