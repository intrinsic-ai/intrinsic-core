apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvstore-service
spec:
  # Replicas must NOT be set to more than 1.
  replicas: 1
  selector:
    matchLabels:
      app: kvstore-service
  template:
    metadata:
      labels:
        app: kvstore-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: kvstore-service
          image: "{{ .Values.registry }}{{ .Values.images.kvstore_service }}"
          args:
            - intrinsic/platform/pubsub/kvstore_grpc/server_main
            - --port=8087
            - --opencensus_metrics_port=9107
          securityContext:
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-service
  labels:
    app: kvstore-service
spec:
  clusterIP: None
  ports:
    - port: 8087
      name: grpc
    - port: 9107
      name: http-metrics
  selector:
    app: kvstore-service
  type: ClusterIP
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kvstore-service
  labels:
    app: kvstore-service
spec:
  gateways:
    - app-ingress/gateway
  hosts:
    - '*'
  http:
    - match:
        - uri:
            prefix: /intrinsic_proto.kvstore.KVStore/
      route:
        - destination:
            host: kvstore-service
            port:
              number: 8087
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kvstore-service-metrics
  labels:
    prometheus: kube-prometheus
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 10s
      metricRelabelings:
        - action: labeldrop
          regex: pod
  selector:
    matchLabels:
      app: kvstore-service
