syntax = "proto3";

package intrinsic_proto.skills;

import "google/protobuf/empty.proto";
import "intrinsic/kubernetes/generator/proto/auth_options.proto";
import "intrinsic/skills/proto/skill_registry_config.proto";
import "intrinsic/skills/proto/skills.proto";

option go_package = "intrinsic/skills/proto/behavior_tree_registry_go_proto";

message RegisterOrUpdateBehaviorTreeRequest {
  // The registration information for the BehaviorTree
  intrinsic_proto.skills.BehaviorTreeRegistration registration = 1;
}

message RegisterOrUpdateBehaviorTreeResponse {}

message UnregisterBehaviorTreeRequest {
  // The id of the behavior tree's skill representation to remove.
  string id = 1;
}

message ListBehaviorTreeSkillsRequest {}

message ListBehaviorTreeSkillsResponse {
  // The skill descriptions of all registered pBTs.
  repeated intrinsic_proto.skills.Skill skills = 1;
}

service BehaviorTreeRegistry {
  // Auth annotations for consumption by the following helm_chart:
  //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
  option (intrinsic_proto.auth.service_options).auth_methods =
      AUTH_METHOD_API_KEY;

  // Register a BehaviorTree skill in the skill registry.
  rpc RegisterOrUpdateBehaviorTree(RegisterOrUpdateBehaviorTreeRequest)
      returns (RegisterOrUpdateBehaviorTreeResponse) {}

  // Unregister a BehaviorTree skill from the skill registry.
  rpc UnregisterBehaviorTree(UnregisterBehaviorTreeRequest)
      returns (google.protobuf.Empty) {}

  // TODO(b/459765477): Remove this method once all legacy pBTs have been
  // migrated to Process assets.
  // Lists the skill descriptions of all legacy pBTs currently registered in
  // the skill registry.
  rpc ListBehaviorTreeSkills(ListBehaviorTreeSkillsRequest)
      returns (ListBehaviorTreeSkillsResponse) {}
}
