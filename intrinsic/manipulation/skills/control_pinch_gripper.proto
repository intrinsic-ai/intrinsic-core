syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/hardware/gripper/eoat/eoat_service.proto";
import "intrinsic/world/proto/object_world_refs.proto";

option go_package = "intrinsic/manipulation/skills/control_pinch_gripper_go_proto";

message PinchGripperCommand {
  // The pinch gripper resource to control. Requires a resource providing the
  // `intrinsic_proto.eoat.PinchGripper` gRPC service interface and an object
  // representation in the world.
  intrinsic_proto.assets.v1.ResolvedDependency pinch_gripper = 4
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.eoat.PinchGripper"
        requires_object: {}
        skill_annotations: {
          always_provide_connection_info: true
          fallback_manifest_dependency_key: "pinch_gripper"
        }
      }];

  // Skill class for ai.intrinsic.control_pinch_gripper skill. This skill allows
  // to control a pinch gripper to either its open or close position.
  oneof command {
    // Close the pinch gripper. When a grasp is commanded, the real or simulated
    // gripper is actuated. The belief world is updated to reflect the state of
    // the gripper.
    intrinsic_proto.eoat.GraspRequest grasp = 1;
    // Open the pinch gripper. When a release is commanded, the real or
    // simulated gripper is actuated. The belief world is updated to reflect the
    // state of the gripper.
    intrinsic_proto.eoat.ReleaseRequest release = 2;
  }
  // Deprecated.
  optional intrinsic_proto.world.ObjectReference object = 3 [deprecated = true];
}
