################################################################################
# System-level
################################################################################

domain: "example.com"
project: "giza-workcells"
deploy_environment: "GCP"
registry: "gcr.io/giza-workcells"
# Image label for Cloud Robotics Core containers (http-relay-server and
# http-relay-client).
crc_version_label: "crc-0.1.0-8f1571c"

# Values filled in by inctl
# LINT.IfChange
location: ""
installed_by: ""
started_at: ""
robot:
  name: ""
# LINT.ThenChange(//intrinsic/kubernetes/values.go)

opencensus_tracing: true

# feature_options_overrides is set when deploying with chart start,
# normally when developing the feature option, or edited in k9s to temporarily flip it on an
# existing deployment.
feature_options_overrides: ""

# Values filled in either by ArgoCD or --values on the command-line.
project_number: 0
region: ""
cloudInference:
  bucket_suffix: ""
