syntax = "proto3";

package intrinsic_proto.geometry;
import "google/protobuf/duration.proto";
option go_package = "intrinsic/geometry/processing/pipeline_config_go_proto";

// Configuration for a single step
// Next tag: 9
message PipelineStep {
  // Configuration that specifies which processor to use for this step.
  oneof config {
    // NoOpGeometryProcessor is for illustration only, please remove once we
    // have 3 or more other processors available.
    NoOpProcessorConfig no_op = 1;

    // Config for Alpha Wrap
    AlphaWrapProcessorConfig alpha_wrap = 2;

    // Config for Convex Hull
    ConvexHullProcessorConfig convex_hull = 3;

    // Config for Mesh Simplification
    MeshSimplificationProcessorConfig mesh_simplification = 4;

    // Config for Isotropic Remeshing
    IsotropicRemeshingProcessorConfig isotropic_remeshing = 5;

    // Config for Scaling
    ScaleProcessorConfig scale = 6;

    // Config for CoACD
    CoacdProcessorConfig coacd = 7;

    // Config for Voxel Remeshing (meshoptimizer)
    VoxelRemeshingProcessorConfig voxel_remeshing = 8;

    // TODO(stoyang): Add more processors, e.g. make primitive in b/210496736.
  }
}

// Configuration for a geometry processing pipeline.
message PipelineConfiguration {
  // The set of in order steps to perform during the pipeline processing.
  repeated PipelineStep steps = 1;
}

// Configuration data for the NoOpGeometryProcessor
message NoOpProcessorConfig {
  // Nothing here.
}

// Configuration data for the AlphaWrapGeometryProcessor
message AlphaWrapProcessorConfig {
  // The alpha value to use when processing the geometry, should be positive.
  double alpha = 1;
}

// Configuration data for the MeshSimplificationGeometryProcessor
message MeshSimplificationProcessorConfig {
  // The maximum Hausdorff distance to use when processing the geometry. The
  // units for this is meters.
  double max_hausdorff_distance = 1;
  // Optional timeout length for the process. We default to 2 minutes
  // internally if not specified
  optional google.protobuf.Duration timeout = 2;
}

// Configuration data for the ConvexHullGeometryProcessor
message ConvexHullProcessorConfig {
  // Nothing here.
}

// Configuration data for the IsotropicRemeshingGeometryProcessor
message IsotropicRemeshingProcessorConfig {
  // The edge reduction factor to use when processing the geometry, should be
  // positive.
  double edge_reduction_factor = 1;
  int32 num_iterations = 2;
}

// Configuration data for the ScaleGeometryProcessor
message ScaleProcessorConfig {
  // Scale factor to apply to the geometry, should be positive.
  oneof scale {
    // A uniform scale factor to apply to the geometry.
    double scale_factor = 1;
  }
}

// Configuration data for the CoacdGeometryProcessor
message CoacdProcessorConfig {
  // The threshold value to use for CoACD decomposition which controls how
  // accurate the convex hulls must be.
  double threshold = 1;
  // The max number of convex hulls to generate in the decomposition.
  int32 max_convex_hull = 2;
}

// Configuration data for the VoxelRemeshingGeometryProcessor
message VoxelRemeshingProcessorConfig {
  // Dimension of the internal voxel grid used by meshoptimizer's voxel remesher
  // (`meshopt_remesh`). The largest axis of the input mesh's bounding box spans
  // `resolution - 2` voxels (one empty padding voxel on each side). Must be in
  // [4, 256], meshoptimizer's supported range (see `kMinVoxelRemeshResolution`
  // / `kMaxVoxelRemeshResolution` in intrinsic/geometry/api/remesh_mesh.h);
  // other values, including unset (0), are rejected. Higher values preserve
  // finer detail at the cost of more output triangles, memory, and runtime.
  int32 resolution = 1;
}
