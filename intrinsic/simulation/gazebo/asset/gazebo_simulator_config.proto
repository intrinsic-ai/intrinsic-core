syntax = "proto3";

package intrinsic_proto.simulation.gazebo.v1;

import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";

message GazeboConfig {
  // The resolved dependency for the Intrinsic runtime.
  intrinsic_proto.assets.v1.ResolvedDependency intrinsic_runtime = 2
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.geometry.GeometryService",
        requires: "grpc://intrinsic_proto.world.ObjectWorldService",
      }];

  message SimulationOptions {
    // Default is 500Hz. Decreasing this value can improve performance
    // (real-time factor) but might reduce accuracy and stability of dynamic
    // scene objects in simulation. If you unset this value, physics will be
    // updated at the default rate for Gazebo. See
    // https://sdformat.org/spec/1.12/physics/#physics_max_step_size.
    optional int64 physics_update_rate_hz = 1;
  }

  SimulationOptions simulation_options = 1;
}
