apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifacts-deployment
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: artifacts-deployment
  template:
    metadata:
      labels:
        app: artifacts-deployment
        platform.intrinsic.ai/artifacts-deployment: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: artifacts-deployment
          image: {{ .Values.registry }}{{ .Values.images.artifacts_service }}
          args:
            - intrinsic/storage/artifacts/artifact_service
            - --port=8089
            - --registry_port=8192
            - --containerd_namespace=k8s.io
            - --opencensus_metrics_port=9109
          ports:
            - containerPort: 8192
              hostPort: 17127
              name: http-registry
          volumeMounts:
            - mountPath: "/data/artifact_store"
              name: temp-data-volume
            - mountPath: "/run/containerd"
              name: containerd-socket
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 512Mi
              cpu: 1
      volumes:
        - name: temp-data-volume
          emptyDir: {}
        - name: containerd-socket
          hostPath:
            path: "/run/k3s/containerd"
      securityContext:
        # here we are hitting the crux of the security, host system either have
        # to have contained socked rw for non-privilege users or this needs
        # to run as root. (refer to "workcell should have dev mode" idea)
        runAsUser: 0

---
apiVersion: v1
kind: Service
metadata:
  name: artifacts-deployment
  labels:
    app: artifacts-deployment
spec:
  clusterIP: None
  ports:
    - port: 8089
      name: grpc-artifacts-deployment
    - port: 9109
      name: http-metrics
  selector:
    app: artifacts-deployment
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: artifacts-deployment-metrics
  labels:
    prometheus: kube-prometheus
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 10s
      metricRelabelings:   # This solves high cardinality labeling issue in prometheus tsdb, reach out to intrinsic-data-infra before removing
        - action: labeldrop
          regex: pod
  selector:
    matchLabels:
      app: artifacts-deployment-metrics
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: artifacts-deployment
spec:
  hosts:
    - "*"
  gateways:
    - app-ingress/gateway
  http:
    - match:
        - uri:
            prefix: /intrinsic_proto.storage.artifacts.v1.ArtifactServiceApi/
      route:
        - destination:
            host: artifacts-deployment
            port:
              number: 8089
