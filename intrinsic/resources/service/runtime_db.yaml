apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-db
  template:
    metadata:
      labels:
        app: runtime-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runtime-db
          image: {{ .Values.registry }}{{ .Values.images.runtime_db }}
          args:
            - intrinsic/resources/service/runtimedbmain
            - --logtostderr
            - --port=8080
            - --opencensus_metrics_port=9101
            - --buckets=resources,skills
            - --path=/mnt/runtime-db/runtime.db
          volumeMounts:
            - name: runtime-db
              mountPath: /mnt/runtime-db
          securityContext:
            readOnlyRootFilesystem: true
      volumes:
        - name: runtime-db
          persistentVolumeClaim:
            claimName: runtime-db-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runtime-db-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-db
  labels:
    app: runtime-db
spec:
  ports:
    - port: 8080
      name: grpc-runtime-db
  selector:
    app: runtime-db
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-db-metrics
  labels:
    app: runtime-db-metrics
spec:
  clusterIP: None
  ports:
    - port: 9101
      name: http-metrics
  selector:
    app: runtime-db
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: runtime-db-metrics
  labels:
    prometheus: kube-prometheus
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      metricRelabelings:   # This solves high cardinality labeling issue in prometheus tsdb, reach out to intrinsic-data-infra before removing
        - action: labeldrop
          regex: pod
  selector:
    matchLabels:
      app: runtime-db-metrics
