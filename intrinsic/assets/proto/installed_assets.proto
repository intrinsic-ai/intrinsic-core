syntax = "proto3";

package intrinsic_proto.assets.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/longrunning/operations.proto";
import "intrinsic/assets/data/proto/v1/data_asset.proto";
import "intrinsic/assets/hardware_devices/proto/v1/hardware_device_manifest.proto";
import "intrinsic/assets/processes/proto/process_asset.proto";
import "intrinsic/assets/proto/asset_tag.proto";
import "intrinsic/assets/proto/asset_type.proto";
import "intrinsic/assets/proto/id.proto";
import "intrinsic/assets/proto/metadata.proto";
import "intrinsic/assets/proto/v1/asset.proto";
import "intrinsic/assets/proto/v1/reference.proto";
import "intrinsic/assets/proto/v1/search.proto";
import "intrinsic/assets/proto/view.proto";
import "intrinsic/assets/scene_objects/proto/scene_object_manifest.proto";
import "intrinsic/assets/services/proto/service_manifest.proto";
import "intrinsic/assets/services/proto/v1/service_inspection.proto";
import "intrinsic/kubernetes/generator/proto/auth_options.proto";
import "intrinsic/skills/proto/processed_skill_manifest.proto";
import "intrinsic/util/status/extended_status.proto";

option go_package = "intrinsic/assets/proto/installed_assets_go_proto";

// Service to manage the installation of assets.
service InstalledAssets {
  // Auth annotations for consumption by the following helm_chart:
  //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
  option (intrinsic_proto.auth.service_options).auth_methods =
      AUTH_METHOD_API_KEY;

  // Lists the currently installed assets.
  rpc ListInstalledAssets(ListInstalledAssetsRequest)
      returns (ListInstalledAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/installedAssets"
    };
  }

  // Gets a specific installed asset.
  rpc GetInstalledAsset(GetInstalledAssetRequest) returns (InstalledAsset) {
    option (google.api.http) = {
      get: "/v1/installedAssets/{id.package}/{id.name}"
    };
  }

  // Gets a batch of installed assets.
  rpc BatchGetInstalledAssets(BatchGetInstalledAssetsRequest)
      returns (BatchGetInstalledAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/installedAssets:batchGet"
      body: "*"
    };
  }

  // Installs the specified asset into the solution.
  rpc CreateInstalledAsset(CreateInstalledAssetRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "CreateInstalledAssetMetadata"
      response_type: "InstalledAsset"
    };
    option (google.api.http) = {
      post: "/v1/installedAssets"
      body: "asset"
    };
  }

  // Installs the specified assets into the solution.
  rpc CreateInstalledAssets(CreateInstalledAssetsRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "CreateInstalledAssetsMetadata"
      response_type: "CreateInstalledAssetsResponse"
    };
    option (google.api.http) = {
      post: "/v1/installedAssets:batchCreate"
      body: "*"
    };
  }

  // Updates the specified asset in the solution.
  rpc UpdateInstalledAsset(UpdateInstalledAssetRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "UpdateInstalledAssetMetadata"
      response_type: "InstalledAsset"
    };
    option (google.api.http) = {
      patch: "/v1/installedAssets/{installed_asset.name}"
      body: "installed_asset"
    };
  }

  // Updates the specified assets in the solution.
  rpc BatchUpdateInstalledAssets(BatchUpdateInstalledAssetsRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "BatchUpdateInstalledAssetsMetadata"
      response_type: "BatchUpdateInstalledAssetsResponse"
    };
    option (google.api.http) = {
      post: "/v1/installedAssets:batchUpdate"
      body: "*"
    };
  }

  // Uninstalls the specified asset from the solution.
  rpc DeleteInstalledAsset(DeleteInstalledAssetRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "DeleteInstalledAssetMetadata"
      response_type: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/v1/installedAssets/{id.package}/{id.name}"
    };
  }

  // Uninstalls the specified assets from the solution.
  rpc DeleteInstalledAssets(DeleteInstalledAssetsRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      metadata_type: "DeleteInstalledAssetsMetadata"
      response_type: "google.protobuf.Empty"
    };
    option (google.api.http) = {
      delete: "/v1/installedAssets:batchDelete"
      body: "*"
    };
  }
}

// A read-only version of InstalledAssets, for contexts in which the solution
// definition should not be modified.
service InstalledAssetsReader {
  // Auth annotations for consumption by the following helm_chart:
  //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
  option (intrinsic_proto.auth.service_options).auth_methods =
      AUTH_METHOD_API_KEY;

  // Lists the currently installed assets.
  rpc ListInstalledAssets(ListInstalledAssetsRequest)
      returns (ListInstalledAssetsResponse);

  // Gets a specific installed asset.
  rpc GetInstalledAsset(GetInstalledAssetRequest) returns (InstalledAsset);

  // Gets a batch of installed assets.
  rpc BatchGetInstalledAssets(BatchGetInstalledAssetsRequest)
      returns (BatchGetInstalledAssetsResponse);
}

message ListInstalledAssetsRequest {
  message Filter {
    // Deprecated: use asset_types instead.

    // TODO(b/391874823): Remove this field.

    optional AssetType asset_type = 1 [deprecated = true];

    // Filter assets by type (OR).
    repeated AssetType asset_types = 2;

    // Filter by assets that provide all of the specified interfaces (exact
    // match).
    //
    // The nature of the interface depends on the asset type, but is always
    // represented as a string. For example, a Data asset provides a proto of
    // a specific type, and its "interface" is the fully qualified name of that
    // proto. A Service can provide a gRPC service, and its "interface" is the
    // fully qualified proto prefix of that gRPC service.
    repeated string provides = 3;

    // Filter assets by asset tag.
    optional intrinsic_proto.assets.AssetTag asset_tag = 4;
  }

  int64 page_size = 1;
  string page_token = 2;
  optional Filter strict_filter = 3;

  // Order by which to sort the assets.
  intrinsic_proto.assets.v1.OrderBy order_by = 4;

  // If true, sort assets in descending order.
  bool sort_descending = 5;

  intrinsic_proto.catalog.AssetViewType view = 6;
}

message InstalledAsset {
  message DataMetadata {
    // The fully qualified proto name of the data payload.
    // Deprecated: Please use the provides field in the metadata.
    string proto_name = 1 [deprecated = true];
  }
  message DataDeploymentData {
    intrinsic_proto.data.v1.DataAsset data = 1;
  }
  message SceneObjectDeploymentData {
    intrinsic_proto.scene_objects.ProcessedSceneObjectManifest manifest = 1;
  }
  message ProcessDeploymentData {
    intrinsic_proto.processes.ProcessAsset process = 1;
  }
  message ServiceMetadata {
    // The list of gRPC services that the Service exposes.
    // Deprecated: Please use the provides field in the metadata.
    repeated string service_proto_prefixes = 1 [deprecated = true];
    // The inspection config for the service. Optional since not all services
    // support inspection.
    optional services.v1.ServiceInspectionConfig service_inspection_config = 2;
  }
  message SkillMetadata {
    intrinsic_proto.skills.SkillDetails details = 1;
  }
  message HardwareDeviceMetadata {
    // The list of gRPC services that the HardwareDevice exposes.
    // Deprecated: Please use the provides field in the metadata.
    repeated string service_proto_prefixes = 1 [deprecated = true];
    // The inspection config for the HardwareDevice. Optional since not all
    // HardwareDevice support inspection.
    optional services.v1.ServiceInspectionConfig service_inspection_config = 2;
  }
  message DeploymentData {
    oneof variant {
      DataDeploymentData data = 1;
      SceneObjectDeploymentData scene_object = 2;
      ProcessDeploymentData process = 3;
    }
  }

  // The name of the Installed Asset.  By convention this is the id (e.g.
  // some.package.name) and setting it manually is not yet supported.  This
  // field can be used to populate the asset field for AssetInstances and to
  // reference Assets within a solution.
  string name = 7 [(google.api.field_behavior) = IDENTIFIER];

  // The definition of the Asset that is being installed in the solution. A
  // basic view of this field that only includes metadata is returned on all
  // views except FULL, which includes full contents. This provides backwards
  // compatibilty with older clients using limited views that may be sensitive
  // to the amount of data received.
  Asset asset = 8;

  Metadata metadata = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  oneof asset_specific_metadata {
    DataMetadata data_specific_metadata = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];
    ServiceMetadata service_specific_metadata = 3
        [(google.api.field_behavior) = OUTPUT_ONLY];
    SkillMetadata skill_specific_metadata = 6
        [(google.api.field_behavior) = OUTPUT_ONLY];
    HardwareDeviceMetadata hardware_device_specific_metadata = 5
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  DeploymentData deployment_data = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListInstalledAssetsResponse {
  repeated InstalledAsset installed_assets = 1;

  // Pass this token to the subsequent list request to obtain the next page.
  string next_page_token = 2;
}

message GetInstalledAssetRequest {
  Id id = 1;
  intrinsic_proto.catalog.AssetViewType view = 2;
}

message BatchGetInstalledAssetsRequest {
  repeated Id ids = 1;
  intrinsic_proto.catalog.AssetViewType view = 2;
}

message BatchGetInstalledAssetsResponse {
  repeated InstalledAsset installed_assets = 1;
}

enum UpdatePolicy {
  // Use a default policy, which may change with platform updates.
  UPDATE_POLICY_UNSPECIFIED = 0;
  // Only add new assets to the solution and reject any that would
  // trigger an update of any installed asset.
  UPDATE_POLICY_ADD_NEW_ONLY = 10;
  // Only update assets if they are currently unused.
  UPDATE_POLICY_UPDATE_UNUSED = 20;
  // Only update assets if all are considered reasonably compatible. This may
  // allow backwards incompatible changes if it will not cause problems for the
  // solution.  If an asset is unused, then any update will be allow.
  UPDATE_POLICY_UPDATE_COMPATIBLE = 50;
}

message CreateInstalledAssetRequest {
  message Asset {
    oneof variant {
      IdVersion catalog = 1;
      SolutionAsset solution_asset = 8;
      intrinsic_proto.services.ProcessedServiceManifest service = 2;
      intrinsic_proto.scene_objects.ProcessedSceneObjectManifest scene_object =
          3;
      intrinsic_proto.skills.ProcessedSkillManifest skill = 4;
      intrinsic_proto.data.v1.DataAsset data = 5;
      intrinsic_proto.hardware_devices.v1.ProcessedHardwareDeviceManifest
          hardware_device = 6;

      // In addition to some fields in the asset metadata, the following derived
      // fields will get updated automatically during the create request:
      // - [ProcessAsset.behavior_tree.description.id_version]
      // - [ProcessAsset.behavior_tree.description.sideloaded]
      // This only applies to Process assets created via this variant and not
      // when using, e.g., 'variant.catalog'.
      intrinsic_proto.processes.ProcessAsset process = 7;
    }

    reserved 199;
  }

  Asset asset = 1;
  UpdatePolicy policy = 2;
}

message CreateInstalledAssetMetadata {
  // Warnings associated with the installation of the Asset, including any
  // associated dependency validation errors.
  intrinsic_proto.status.ExtendedStatus warnings = 1;
}

message CreateInstalledAssetsRequest {
  message Asset {
    oneof variant {
      IdVersion catalog = 1;
      SolutionAsset solution_asset = 8;
      intrinsic_proto.services.ProcessedServiceManifest service = 2;
      intrinsic_proto.scene_objects.ProcessedSceneObjectManifest scene_object =
          3;
      intrinsic_proto.skills.ProcessedSkillManifest skill = 4;
      intrinsic_proto.data.v1.DataAsset data = 5;
      intrinsic_proto.hardware_devices.v1.ProcessedHardwareDeviceManifest
          hardware_device = 6;

      // In addition to some fields in the asset metadata, the following derived
      // fields will get updated automatically during the create request:
      // - [ProcessAsset.behavior_tree.description.id_version]
      // - [ProcessAsset.behavior_tree.description.sideloaded]
      // This only applies to Process assets created via this variant and not
      // when using, e.g., 'variant.catalog'.
      intrinsic_proto.processes.ProcessAsset process = 7;
    }

    reserved 199;
  }

  repeated Asset assets = 1;
  UpdatePolicy policy = 2;
}

message CreateInstalledAssetsMetadata {
  // Warnings associated with the installation of the Assets, including any
  // associated dependency validation errors.
  intrinsic_proto.status.ExtendedStatus warnings = 1;
}

message CreateInstalledAssetsResponse {
  // The description of the installed assets, in the order requested for
  // installation.
  repeated InstalledAsset installed_assets = 1;
}

message UpdateInstalledAssetRequest {
  // The asset to update.
  //
  // - `installed_asset.asset` must be populated with a `catalog` or `local`
  //   source.
  // - `installed_asset.name` may be omitted, but if set, it must match the
  //   asset ID (`<package>.<name>`) in `installed_asset.asset`.
  // - All other fields on `InstalledAsset` are output-only and ignored.
  InstalledAsset installed_asset = 1 [(google.api.field_behavior) = REQUIRED];

  // Policy governing how existing asset instances are handled. Defaults to
  // `UPDATE_POLICY_UPDATE_COMPATIBLE` if unspecified.
  // `UPDATE_POLICY_ADD_NEW_ONLY` is not supported and will result in an
  // `INVALID_ARGUMENT` error.
  UpdatePolicy policy = 2;

  // If true, the asset will be installed if it is not already present in the
  // solution. If false, attempting to update an asset that is not currently
  // installed will fail with `NOT_FOUND`.
  bool allow_missing = 3;
}

message UpdateInstalledAssetMetadata {
  // Warnings associated with the update of the Asset, including any
  // associated dependency validation errors.
  intrinsic_proto.status.ExtendedStatus warnings = 1;
}

message BatchUpdateInstalledAssetsRequest {
  // The individual update requests to apply. At most one version of a given
  // asset ID may be specified across the batch.
  repeated UpdateInstalledAssetRequest requests = 1
      [(google.api.field_behavior) = REQUIRED];

  // Default update policy for the batch. `UPDATE_POLICY_ADD_NEW_ONLY` is not
  // supported. All requests in the batch share a single effective policy:
  // individual `requests` should leave `policy` unspecified or set it to the
  // same value, otherwise `INVALID_ARGUMENT` is returned.
  UpdatePolicy policy = 2;

  // If true, missing assets will be installed for all requests in the batch. If
  // false, individual `requests` may still set `allow_missing = true` for
  // specific assets.
  bool allow_missing = 3;
}

message BatchUpdateInstalledAssetsMetadata {
  // Warnings associated with the update of the Assets, including any
  // associated dependency validation errors.
  intrinsic_proto.status.ExtendedStatus warnings = 1;
}

message BatchUpdateInstalledAssetsResponse {
  // The description of the updated assets, in the order requested for
  // update.
  repeated InstalledAsset installed_assets = 1;
}

enum DeletePolicy {
  // Use a default policy, which may change with platform updates.
  POLICY_UNSPECIFIED = 0;
  // Reject a request to delete an asset that is currently in use.
  POLICY_REJECT_USED = 10;
}

message DeleteInstalledAssetRequest {
  Id asset = 1;
  DeletePolicy policy = 2;
}

message DeleteInstalledAssetMetadata {}

message DeleteInstalledAssetsRequest {
  enum Policy {
    // Use a default policy, which may change with platform updates.
    POLICY_UNSPECIFIED = 0;
    // Reject a request to delete an asset that is currently in use.
    POLICY_REJECT_USED = 10;
  }

  repeated Id assets = 1;
  Policy policy = 2;
}

message DeleteInstalledAssetsMetadata {}
