apiVersion: apps/v1
kind: Deployment
metadata:
  name: solution-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solution-service
  template:
    metadata:
      labels:
        app: solution-service
    spec:
      containers:
        - name: solution-service
          image: {{ .Values.registry }}{{ .Values.images.solution_service }}
          args:
            - /intrinsic/frontend/solution_service/solution_service_main
            - --port=8082
            - --hss_address=hot-shared-state.app-intrinsic-base.svc.cluster.local:9777
            - --transfer_service_address=workcell-cluster-service.app-intrinsic-base.svc.cluster.local:9957
            - --skill_registry_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --installed_assets_service_address=istio-ingressgateway.app-ingress.svc.cluster.local:80
            - --modified_solution_service_address=modified-solution-service.app-intrinsic-base.svc.cluster.local:8080
            {{ if .Values.feature_options.enable_backend_sequence_list }}
            - --logger_address=logger.app-intrinsic-base.svc.cluster.local:8080
            {{ end}}
            - --opencensus_metrics_port=9103
            - --opencensus_tracing={{ .Values.opencensus_tracing }}
            - --trace_probability=0.01
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: solution-service
  labels:
    app: solution-service
spec:
  ports:
    - port: 8082
      name: grpc-solution-service
  selector:
    app: solution-service
---
apiVersion: v1
kind: Service
metadata:
  name: solution-service-metrics
  labels:
    app: solution-service-metrics
spec:
  ports:
    - port: 9103
      name: http-solution-service-metrics
  selector:
    app: solution-service
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: solution-service
spec:
  hosts:
    - "*"
  gateways:
    - app-ingress/gateway
  http:
    - match:
        - uri:
            prefix: /intrinsic_proto.solution.v1.SolutionService/
      route:
        - destination:
            host: solution-service
            port:
              number: 8082
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: solution-service-metrics
  labels:
    prometheus: kube-prometheus
spec:
  endpoints:
    - port: http-solution-service-metrics
      path: /metrics
      interval: 30s
      metricRelabelings:
        - action: labeldrop
          regex: pod
  selector:
    matchLabels:
      app: solution-service-metrics
