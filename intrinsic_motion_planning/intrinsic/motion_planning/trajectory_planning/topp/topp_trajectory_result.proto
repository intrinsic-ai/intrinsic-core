syntax = "proto3";

package intrinsic_proto.topp;

import "intrinsic/icon/proto/joint_space.proto";
import "intrinsic/motion_planning/proto/v1/motion_events.proto"; 
import "intrinsic/motion_planning/trajectory_planning/topp/bspline_squared_path_velocity.proto";
import "intrinsic/motion_planning/trajectory_planning/topp/piecewise_linear_squared_path_velocity.proto";

option go_package = "intrinsic/motion_planning/trajectory_planning/topp/topp_trajectory_result_go_proto";

// The result of a TOPP trajectory optimization.
message ToppTrajectoryResult {
  // The continuous version of the trajectory.
  oneof squared_path_velocity_type {
    BSplineSquaredPathVelocity squared_path_velocity = 1;
    PiecewiseLinearSquaredPathVelocityProto
        piecewise_linear_squared_path_velocity = 4;
  }

  // The discrete version of the trajectory.
  intrinsic_proto.icon.JointTrajectoryPVA trajectory = 2;


  // The motion events associated with the trajectory.
  repeated intrinsic_proto.motion_planning.v1.MotionEvent motion_events = 3;

}
