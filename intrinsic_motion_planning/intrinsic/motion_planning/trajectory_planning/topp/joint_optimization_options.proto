syntax = "proto3";

package intrinsic;

option go_package = "intrinsic/motion_planning/trajectory_planning/topp/joint_optimization_options_go_proto";

// Used to configure if Cartesian constraints based on a kinematics model are
// active. It includes Cartesian velocity and Cartesian acceleration
// constraints. By default:
// * activate_cartesian_velocity_constraints = false
// * activate_cartesian_acceleration_constraints = false
message CartesianOptimizationOptions {
  // If true, enforces Cartesian velocity limits on both the target frame
  // (`PathSample::cart_limits`) and any additional monitored frames
  // (`PathSample::frame_cartesian_limits`). Frame limits in
  // `frame_cartesian_limits` are ignored when this option is false.
  optional bool activate_cartesian_velocity_constraints = 1;

  // If true, enforces Cartesian acceleration limits on the target frame
  // (`PathSample::cart_limits`). Does not apply to additional monitored frames
  // (`PathSample::frame_cartesian_limits`).
  optional bool activate_cartesian_acceleration_constraints = 2;

  reserved 3;
}

// Used to configure if constraints based on a dynamics model are active. It
// includes torque and torque rate constraints. By default:
// * activate_joint_torque_constraints = true
// * activate_joint_torque_rate_constraints = false
message DynamicJointOptimizationOptions {
  optional bool activate_joint_torque_constraints = 1;
  optional bool activate_joint_torque_rate_constraints = 2;
}

// Used to configure constraints over joint acceleration and joint jerk. By
// default:
// * activate_joint_acceleration_constraints = true
// * activate_joint_jerk_constraints = false
message KinematicJointOptimizationOptions {
  optional bool activate_joint_acceleration_constraints = 1;
  optional bool activate_joint_jerk_constraints = 2;
}

// Used to configure all constraints to be satisfied by the optimized
// trajectory.
message OptimizationOptions {
  oneof kino_dynamic_constraints {
    DynamicJointOptimizationOptions dynamic_constraints = 1;
    KinematicJointOptimizationOptions kinematic_constraints = 2;
  }
  optional CartesianOptimizationOptions cartesian_constraints = 3;
}
