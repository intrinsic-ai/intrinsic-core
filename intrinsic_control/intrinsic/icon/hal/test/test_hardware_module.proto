syntax = "proto3";

package intrinsic_proto.testing;

option go_package = "intrinsic/icon/hal/test_hardware_module_go_proto";

message TestHardwareModule {
  // A prefix for all the hardware interfaces in a TestHardwareModule.
  string interface_prefix = 1;
  // When present, the module will advertise a strict digital command interface
  // with this name and two bits.
  // The status of the interface is not reflected anywhere.
  // The module checks the validity of the command on ApplyCommand.
  optional string strict_dio_command_interface_name = 2;
  // Do illegal mallocs during first ReadStatus() and first ApplyCommand().
  bool do_illegal_mallocs = 3;
}
