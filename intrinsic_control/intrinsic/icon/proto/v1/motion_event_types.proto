syntax = "proto3";

package intrinsic_proto.icon.v1;

import "intrinsic/icon/actions/adio.proto";

option go_package = "intrinsic/icon/proto/v1/motion_event_types_go_proto";

message ADIOEvent {
  // ICON ADIO part which is written to.
  string part_name = 1;
  // The IOs and their values to be set.
  intrinsic_proto.icon.actions.proto.SetAnalogDigitalOutputs
      set_analog_digital_outputs = 2;
}

// Defines a standardized catalog of events that can be triggered along the
// trajectory.
message TrajectoryEvent {
  oneof event {
    // To set any ADIO signals during the motion.
    ADIOEvent adio_event = 1;
  }
}
