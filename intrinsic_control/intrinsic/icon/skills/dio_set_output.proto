syntax = "proto3";

package intrinsic_proto.skills;

option go_package = "intrinsic/icon/skills/dio_set_output_go_proto";

message DioSetOutputParams {
  // Digital IO output blocks to set. Each block must have a unique
  // `block_name`. Returns `ALREADY_EXISTS` error on duplicate names.
  repeated DioOutputBlock dio_output_blocks = 4;

  reserved 1, 2, 3;
  reserved "block_name", "indices", "values";
}

message DioOutputBlock {
  // Name of the Digital IO (input/output) block in which the output values
  // should be set. You can look up the list of block names, indices, and
  // current values of digital inputs in the Services panel, on the settings
  // page of the real-time control or robot control service, in the 'I/O
  // mapping' window. Must be unique across `dio_output_blocks`. Returns
  // `ALREADY_EXISTS` error on duplicate names.
  string block_name = 1;

  // Indices to set within the Digital IO (input/output) block. To set the first
  // value, use 0. The maximal supported number of indices is 64 and
  // the maximum allowed index is 63.
  repeated uint32 indices = 2;

  // Corresponding output values that the indices within the Digital IO block
  // should be set to. Must have same size as `indices`.
  repeated bool values = 3;
}
