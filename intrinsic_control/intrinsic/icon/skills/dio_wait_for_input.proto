syntax = "proto3";

package intrinsic_proto.skills;

import "google/protobuf/duration.proto";
import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/icon/proto/v1/field_metadata.proto";

option go_package = "intrinsic/icon/skills/dio_wait_for_input_go_proto";

message DioWaitForInputParams {
  // Robot controller to wait for ADIO input on.
  intrinsic_proto.assets.v1.ResolvedDependency adio = 6
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.icon.v1.IconApi",
        skill_annotations: { fallback_manifest_dependency_key: "adio" }
      }];

  // Deprecated. Use field `input_block`.
  string block_name = 1 [deprecated = true];

  // Deprecated. Use field `input_block`.
  repeated uint32 indices = 2 [deprecated = true];

  // Deprecated. Use field `input_block`.
  repeated bool values = 3 [deprecated = true];

  // Duration after which the skill will create a timeout error if the desired
  // signal(s) were not triggered.
  google.protobuf.Duration timeout = 4;

  // The digital input to wait for.
  DigitalInputBlock input_block = 5 [
    (intrinsic_proto.icon.v1.field_metadata) = { resolved_at_runtime: "adio" }
  ];
}

message DigitalInputBlock {
  // Specifies the name of the digital input (DI) block the skill should watch.
  // You can look up a list of block names, indices, and current values of
  // digital inputs in the Services panel, on the settings page of the real-time
  // control service, or in the 'I/O mapping' window.
  string block_name = 1;

  // Specifies all the indices of the bits within the digital input block whose
  // values need to match.
  // For example, if you want to wait only for the first
  // bit of the block, add one entry with the value 0.
  repeated uint32 indices = 2;

  // Specifies all the bit values within the digital input block which have to
  // match. Add the same number of entries as there are indices. An activated
  // UI toggle corresponds to 1/high, and a deactivated UI toggle corresponds to
  // 0/low. The skill returns only when all digital inputs indices have the
  // defined values.
  repeated bool values = 3;
}
