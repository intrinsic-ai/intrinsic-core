syntax = "proto3";

package intrinsic_proto.skills;

import "google/protobuf/duration.proto";
import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/icon/proto/v1/field_metadata.proto";

option go_package = "intrinsic/icon/skills/dio_read_input_go_proto";

message DioReadInputParams {
  // Robot controller to read ADIO inputs from.
  intrinsic_proto.assets.v1.ResolvedDependency adio = 5
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.icon.v1.IconApi",
        skill_annotations: { fallback_manifest_dependency_key: "adio" }
      }];

  // Specifies the name of the DIO (Digital Input/Output) block from which
  // values will be read. You can look up the list of block names, indices, and
  // current values of digital inputs in the Services panel, on the settings
  // page of the real-time control or robot control service, in the 'I/O
  // mapping' window.
  string block_name = 1 [
    (intrinsic_proto.icon.v1.field_metadata) = { resolved_at_runtime: "adio" }
  ];

  // If the DIOs could not be read within this duration, the skill will create a
  // timeout error. Defaults to 5 seconds.
  optional google.protobuf.Duration timeout = 2;

  // Name of the robot. Deprecated. Do not use. Value will be ignored.
  string robot_name = 3 [deprecated = true];
  // Name of the ADIO part. Deprecated. Do not use. Value will be ignored.
  string part_name = 4 [deprecated = true];
}

message DioReadInputReturnValue {
  // All signal values of the specified block from the input parameters. The
  // list contains all digital inputs available in the selected block. The list
  // is ordered by index. You can look up the order and current values in the
  // Services panel, on the settings page of the real-time control or robot
  // control service, in the 'I/O mapping' window.
  repeated bool values = 3;
}
