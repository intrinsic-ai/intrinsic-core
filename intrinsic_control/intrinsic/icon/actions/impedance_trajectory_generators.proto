syntax = "proto3";

package intrinsic_proto.icon.actions.proto;

import "google/protobuf/duration.proto";
import "intrinsic/icon/actions/cartesian_impedance.proto";
import "intrinsic/icon/proto/cart_space.proto";

option go_package = "intrinsic/icon/actions/impedance_trajectory_generators_go_proto";

// Defines a Lissajous search pattern on a 2d task plane. For example, this
// enables robot motion following a planar search pattern as described in
// https://en.wikipedia.org/wiki/Lissajous_curve. If one of the search window
// sizes is set zero, the search is executed on a straight line.
message LissajousSearchPattern2D {
  // Width of search rectangle in the task-plane's x-direction.
  double x_size = 1;
  // Width of search rectangle in the task-plane's y-direction.
  double y_size = 2;
  // Maximum translational velocity during search, defaults to 0.01 m/s.
  optional double max_velocity = 3;
  // Defines the density of the search pattern. Must be selected from the
  // interval [5,9], defaults to 5. The higher the integer, the denser the
  // search pattern and the longer the period.
  optional uint32 max_lissajous_integer = 4;
}

// Generates realtime Cartesian impedance references alongside a Lissajous
// pattern which can be used for the Cartesian admittance or impedance actions.
message LissajousImpedanceSearchPattern {
  // Defines task frame in robot base frame. The z-axis of the task frame is
  // the insertion direction (the direction in which which the robot should
  // apply a search force is positive z). If unset, the previously commanded
  // Cartesian state will be used to set base_t_task based on current position.
  optional intrinsic_proto.icon.Transform base_t_task = 1;

  // Parameters of the 2d Lissajous search pattern in the task plane,
  // expressed w.r.t base_t_task
  LissajousSearchPattern2D search_pattern_2d = 2;

  // Amplitude of rotational oscillation around search z axis. Defaults to zero.
  optional double yaw_oscillation_amplitude_rad = 3;

  // Frequency of rotational oscillation around search z axis. Defaults to zero.
  optional double yaw_oscillation_frequency_hz = 4;

  // Feedforward force (in N) to exert along the motion direction, which is
  // aligned with the z-axis of the task frame.
  double search_force_newton = 5;

  // Combined stiffness of arm and environment during contact. Used to compute
  // an overdamping coefficient for stable contact.
  double contact_stiffness = 6;

  // Virtual translational stiffness of end-effector in the 2d search plane,
  // in x-y direction of the task frame. Defaults to zero.
  optional double translational_virtual_stiffness_x_y = 7;

  // Virtual rotational stiffness of end-effector in uncontrolled dimensions
  // (roll, pitch). For a peg-in-hole task, this is rotational stiffness about
  // the hole's (task frame's) x and y axis. Defaults to zero.
  optional double rotational_virtual_stiffness_roll_pitch = 8;

  // Virtual rotational stiffness of end-effector in controlled dimension
  // (yaw). For a peg-in-hole task, this is the rotational stiffness about the
  // hole's z-axis. Defaults to zero.
  optional double rotational_virtual_stiffness_yaw = 9;

  // Desired virtual task-space inertia in translation.
  double translational_virtual_inertia = 10;

  // Desired virtual task-space inertia in rotation.
  double rotational_virtual_inertia = 11;

  // Transform from the robot's flange to a target frame where motions and
  // forces are being commanded. Defaults to Identity.
  optional intrinsic_proto.icon.Transform robot_tip_t_robot_tool = 12;
}

// A general-purpose impedance sepoint trajectory generator linearly
// interpolating arbitrary Cartesian impedance setpoints with given time stamps.
message LinearImpedanceSetpointInterpolator {
  // Time stamps of the Cartesian impedance waypoints in seconds. The first time
  // stamp must be zero.
  repeated google.protobuf.Duration time_stamps = 1;

  // List of Cartesian impedance waypoints, which needs to have same size as the
  // time_stamps list.
  repeated CartesianTarget cartesian_impedance_waypoints = 2;
}
