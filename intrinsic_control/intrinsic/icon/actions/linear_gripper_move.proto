syntax = "proto3";

package intrinsic_proto.icon.actions.proto;

option go_package = "intrinsic/icon/actions/linear_gripper_move_go_proto";

// Fixed parameters for a LinearGripperMove action. These are provided once by
// the user when the action is created, and remain the same for the lifetime of
// the action.
message LinearGripperMoveFixedParams {
  // The width to move the gripper (m).
  double width = 1;
  // The force to move the gripper with (N) to the specified width.
  //
  // Some gripper device implementations may not use this field.
  optional double force = 2;
  // The speed to move the gripper at (m/s) to the specified width.
  //
  // Some gripper device implementations may not use this field.
  optional double speed = 3;

  // The distance threshold (m) between the commanded width and the sensed width
  // at which the command is considered to be done.
  // If omitted, a default value is used (1mm).
  optional double convergence_tolerance = 4;
}

// Fixed parameters for a LinearGripperStreamingMove action.
//
// The action maintains the initial position of the gripper until the first
// streaming command is sent.
message LinearGripperStreamingMoveFixedParams {}

// Streaming parameters for a LinearGripperStreamingMove action.
message LinearGripperStreamingMoveUpdate {
  // The width to move the gripper (m).
  double width = 1;
  // The force to move the gripper with (N) to the specified width.
  //
  // Some gripper device implementations may not use this field.
  optional double force = 2;
  // The speed to move the gripper at (m/s) to the specified width.
  //
  // Some gripper device implementations may not use this field.
  optional double speed = 3;
}
