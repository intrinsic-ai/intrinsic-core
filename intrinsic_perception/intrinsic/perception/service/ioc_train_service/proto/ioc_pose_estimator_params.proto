syntax = "proto3";

package incode.perception.ioc.proto;

option go_package = "intrinsic_perception/intrinsic/perception/service/ioc_train_service/proto/ioc_pose_estimator_params_go_proto";

// Hyperparameters and detection thresholds for the IOC Pose Estimator.
message IocPoseEstimatorParams {
  // Number of refinement iterations for FoundationPose.
  optional int32 refinement_iters = 1;

  // Confidence / detection score threshold for the object detector.
  optional float confidence_threshold = 2;

  // Minimum visibility threshold for detected objects.
  optional float visibility_threshold = 3;

  // Text prompt for zero-shot open-vocabulary segmentation (e.g. SAM 3).
  optional string text_prompt = 4;
}
