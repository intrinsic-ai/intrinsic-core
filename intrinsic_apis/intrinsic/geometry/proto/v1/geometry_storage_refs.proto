syntax = "proto3";

package intrinsic_proto.geometry.v1;

option go_package = "intrinsic/geometry/proto/v1/geometry_storage_refs_go_proto";

// `GeometryStorageRefs` is intended to be an opaque container of references to
// storage objects. The constituent fields provide no guarantees of uniqueness.
// Clients are strongly discouraged from mutating the contents of this message
// or constructing it from scratch.
//
// Clients should not make any assumptions about the string format of these
// refs, or where the underlying objects are stored. These are subject to change
// without notice. The supported method is to use
// `intrinsic_proto.geometry.GeometryService` to retrieve the underlying
// objects.
//
// This message can also be used to recreate an
// `intrinsic_proto.geometry.v1.InlineGeometry` instance.
message GeometryStorageRefs {
  // A reference to the stored geometry proto.
  // Encoded as `intrinsic_proto.geometry.v1.ExactGeometry`.
  string exact_geometry_ref = 1;

  // A reference to the stored renderable data.
  // Encoded as a glTF binary (GLB) buffer, i.e. the contents of
  // `intrinsic_proto.geometry.v1.Renderable.glb_bytes`.
  string renderable_ref = 2;

  // Whether to keep the renderable because it was user provided as opposed
  // to being auto generated by the system.
  bool keep_renderable = 3;
}
