syntax = "proto3";

package intrinsic_proto.assets;

option go_package = "intrinsic/assets/proto/asset_type_go_proto";

// Identifies the type of an asset.
enum AssetType {

  // LINT.IfChange(asset_types)

  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_SCENE_OBJECT = 1;
  ASSET_TYPE_SERVICE = 2;
  ASSET_TYPE_SKILL = 3;
  ASSET_TYPE_HARDWARE_DEVICE = 4;
  ASSET_TYPE_DATA = 5;
  ASSET_TYPE_PROCESS = 6;

  // LINT.ThenChange(
  //   //intrinsic/assets/type_utils.ts:asset_type_info,
  //   //intrinsic_sdk/intrinsic/assets/typeutils.go:asset_type_info
  // )

}
