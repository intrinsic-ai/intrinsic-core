syntax = "proto3";

package intrinsic_proto.assets.v1;

option go_package = "intrinsic/assets/proto/v1/solution_validation_policy_go_proto";

// A policy to specify the validity required when editing or deploying
// a Solution.
//
// Each policy determines whether each Solution validation issue is treated as
// a warning or error.
enum SolutionValidationPolicy {
  // If undefined, a default validation level may be chosen by the service.
  SOLUTION_VALIDATION_POLICY_UNSPECIFIED = 0;
  // Validation issues that do not prevent the Solution from being deployed on a
  // workcell are treated as warnings. All other validation issues are treated
  // as errors.
  SOLUTION_VALIDATION_POLICY_RECOVERABLE = 10;
  // All validation issues are treated as errors.
  //
  // This policy addresses only validation of the Solution definition.
  // It does not address validation of runtime behavior.
  SOLUTION_VALIDATION_POLICY_STRICT = 20;
}
