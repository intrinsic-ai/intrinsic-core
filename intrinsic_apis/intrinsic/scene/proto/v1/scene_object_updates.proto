syntax = "proto3";

package intrinsic_proto.scene_object.v1;

import "google/protobuf/any.proto";
import "intrinsic/geometry/proto/v1/transformed_geometry.proto";
import "intrinsic/kinematics/types/joint_limits.proto";
import "intrinsic/math/proto/matrix.proto";
import "intrinsic/math/proto/pose.proto";
import "intrinsic/scene/proto/v1/collision_rules.proto";
import "intrinsic/scene/proto/v1/entity.proto";
import "intrinsic/scene/proto/v1/object_properties.proto";
import "intrinsic/world/proto/physics_component.proto";

option go_package = "intrinsic/scene/proto/v1/scene_object_updates_go_proto";

message SceneObjectUpdate {
  // The type of update to apply.
  oneof update {
    EntityPoseUpdate entity_pose = 1;
    CreateFrameUpdate create_frame = 2;
    DeleteEntityUpdate delete_entity = 3;
    SetNamedConfigurationsUpdate set_named_configurations = 4;
    UpdateJointsRequest update_joints = 5;
    CartesianLimitsUpdate cartesian_limits = 6;
    RenameEntityUpdate rename_entity = 7;
    UpdateCollisionRules update_collision_rules = 8;
    UpdateUserData update_user_data = 9;
    SetIKSolversUpdate set_ik_solvers = 10;
    ReparentEntityUpdate reparent_entity = 11;
    UpdateFrameProperties update_frame_properties = 12;
    GeometryUpdate update_geometry = 13;
    UpdatePhysicsProperties update_physics_properties = 14;
    CreateJointUpdate create_joint = 15;
    // TODO(stoyang): Add more updates as we work through the UI flows.
  }
}

// Similar to SceneObjectUpdate but restricted in the types of updates that can
// be performed.
message SceneObjectInstanceUpdate {
  // The type of update to apply.
  oneof update {
    EntityPoseUpdate entity_pose = 1;
    CreateFrameUpdate create_frame = 2;
    SetNamedConfigurationsUpdate set_named_configurations = 4;
    UpdateJointsRequest update_joints = 5;
    CartesianLimitsUpdate cartesian_limits = 6;
    SetIKSolversUpdate set_ik_solvers = 9;
    GeometryUpdate update_geometry = 10;
    UpdateSimulationProperties update_simulation_properties = 11;
    UpdatePhysicsProperties update_physics_properties = 12;

    // TODO(stoyang): Add more updates as we work through the UI flows.

  }

  reserved 3, 7, 8;
  reserved "delete_entity", "rename_entity", "update_collision_rules";
}

// A list of updates to apply to a scene object.
message SceneObjectUpdates {
  // The updates to apply in order.
  repeated SceneObjectUpdate updates = 1;
}

// A list of updates to apply to a scene object instance.
message SceneObjectInstanceUpdates {
  // The updates to apply in order.
  repeated SceneObjectInstanceUpdate updates = 1;
}

message EntityPoseUpdate {
  // The name of the entity being updated.
  string entity_name = 1;

  // The new pose of this entity relative to its parent.
  intrinsic_proto.Pose parent_t_this = 2;
}

// Create a new frame based entity with the given parameters.
message CreateFrameUpdate {
  // The entity under which the frame shall be created. If the name is empty we
  // will create the new frame under root. If the name cannot be found this will
  // result in an error.
  string parent_name = 1;

  // Name of the new frame entity to be created.
  string new_frame_name = 2;

  // Pose of the frame in the space of the parent entity's origin.
  intrinsic_proto.Pose parent_t_new_frame = 3;

  // We can optionally mark this frame as an attachment frame when creating it.
  bool designate_as_attachment_frame = 4;
}

message DeleteEntityUpdate {
  // The entity to be deleted.
  string entity_name = 1;

  enum ChildPolicy {
    // Same as CHILD_POLICY_FAIL_IF_PRESENT.
    CHILD_POLICY_UNSPECIFIED = 0;
    // If the entity has children we will fail to delete it.
    CHILD_POLICY_FAIL_IF_PRESENT = 1;
    // If the entity has children we will delete them all recursively down.
    CHILD_POLICY_DELETE_RECURSIVELY = 2;
    // If the entity has children, they will be reparented to the parent of the
    // deleted entity maintaining the same pose to it as is currently set. If we
    // have a chain of entities A -> B -> C, and B -> D, where A is the parent
    // of B and B is the parent of C and D. When we delete B with this setting,
    // we will reparent C and D to A and maintain the same A_t_C and A_t_D poses
    // as was present before the delete.
    CHILD_POLICY_REPARENT_CHILDREN = 3;
  }
  // Specify what to do with the children of the deleted entity if any exist.
  ChildPolicy child_policy = 2;
}

// Updates the named configurations on the scene object.
message SetNamedConfigurationsUpdate {
  // If set, this will clear all named configurations on the scene object.
  bool clear_all_named_configurations = 1;

  // The named configurations to remove from the scene object.
  repeated string named_configurations_to_remove = 2;

  // The named configurations to set on the scene object. If a named
  // configuration already exists with the same name, it will be overwritten.
  repeated NamedConfiguration named_configurations_to_set = 3;
}

message SetIKSolversUpdate {
  // The IK solver to set on the scene object.
  repeated IkSolver ik_solvers = 1;
}

// Updates the joint positions or limits on the scene object.
message UpdateJointsRequest {
  // If non-empty, new joint positions in degrees (for revolute joints) or
  // meters (for prismatic joints) that should be applied.  At least one
  // of 'joint_positions', 'joint_application_limits', 'joint_system_limits',
  // 'parent_t_inboard' must be set. If 'parent_t_inboard' and `joint_positions`
  // are set, the `joint_positions` will be applied with the new
  // `parent_t_inboard` poses.
  map<string, double> joint_positions = 1;

  // If non-empty, new joint application limits that should be applied. At least
  // one of 'joint_positions', 'joint_application_limits', 'joint_system_limits'
  // must be set.
  map<string, intrinsic_proto.JointLimitUpdate> joint_application_limits = 2;

  // If non-empty, new joint system limits that should be applied. At least one
  // of 'joint_positions', 'joint_application_limits', 'joint_system_limits'
  // must be set.
  map<string, intrinsic_proto.JointLimitUpdate> joint_system_limits = 3;

  // If non-empty, new parent_t_inbord poses that should be applied. At least
  // one of 'joint_positions', 'joint_application_limits',
  // 'joint_system_limits', 'parent_t_inboard' must be set.
  map<string, intrinsic_proto.Pose> parent_t_inboard = 4;
}

// Cartesian limits to use as overrides.
// If not set, the existing limits will be unchanged.

// LINT.IfChange(cartlimits)

message CartesianLimitsUpdate {
  // Units are meters or radians per s, s^2, or s^3.
  repeated double min_translational_position = 1;
  repeated double max_translational_position = 2;
  repeated double min_translational_velocity = 3;
  repeated double max_translational_velocity = 4;
  repeated double min_translational_acceleration = 5;
  repeated double max_translational_acceleration = 6;
  repeated double min_translational_jerk = 7;
  repeated double max_translational_jerk = 8;

  optional double max_rotational_velocity = 9;
  optional double max_rotational_acceleration = 10;
  optional double max_rotational_jerk = 11;
}

// LINT.ThenChange(//intrinsic_apis/intrinsic/scene/proto/v1/object_properties.proto)


message RenameEntityUpdate {
  // The entity to be renamed.
  string entity_name = 1;

  // The new name to give the entity.
  string new_entity_name = 2;
}

// Apply the given update to the collision rules.
message UpdateCollisionRules {
  // The policy to use when updating the given rule.
  enum UpdateCollisionRulesPolicy {
    // Same as POLICY_APPEND.
    POLICY_UNSPECIFIED = 0;
    // Append the new rule to the end of the existing rules.
    POLICY_APPEND = 1;
    // Similar to POLICY_REPLACE but if there is no match then
    // append the new rule to the end of the existing rule set. If multiple
    // rules match then they will all be updated.
    POLICY_REPLACE_OR_APPEND = 2;
    // Remove the rules that match their entity fields. If multiple rules match
    // then they will all be removed.
    POLICY_REMOVE = 3;
    // Clear any existing rules within the respective rule set and replace them
    // with the rules specified here. If the specified rule is a margin rule,
    // all margin rules will be removed, if the specified rule is an exclusion
    // rule, all exclusion rules will be removed before appending the new rule.
    POLICY_CLEAR_AND_REPLACE = 4;
    // Clear all existing rules. Ignores the rule field specified below.
    POLICY_CLEAR_ALL = 5;
  }

  // The policy to use when updating the given rule.
  UpdateCollisionRulesPolicy policy = 1;

  // The rule to use with the given policy for updating the collision rules.
  oneof rule {
    CollisionMarginRule margin_rule = 3 [deprecated = true];
    CollisionExclusionRule exclusion_rule = 4;
  }
}

message UpdateUserData {
  enum UpdateUserDataPolicy {
    // Same as POLICY_INSERT.
    POLICY_UNSPECIFIED = 0;
    // Insert key/value pair(s) into the user data if none of the provided keys
    // already exist.
    // Return an error if any of the provided key exists. SceneObject is not
    // modified in this case.
    POLICY_INSERT = 1;
    // Similar to POLICY_INSERT but if a key already exists, its value will be
    // updated instead of returning an error.
    POLICY_INSERT_OR_UPDATE = 2;
    // Remove key/value pair(s) for matching keys. Values provided in the
    // user_data field are ignored.
    // If no key matches, SceneObject is not modified.
    POLICY_REMOVE = 3;
    // Clear all existing user data and replace it with the new key/value user
    // data. Can be called even if no existing user data is present.
    POLICY_CLEAR_AND_REPLACE = 4;
    // Clear all existing user data.
    // Can be called even if no existing user data is present.
    POLICY_CLEAR_ALL = 5;
  }

  map<string, google.protobuf.Any> user_data = 1;
  UpdateUserDataPolicy policy = 2;
}

message GeometryUpdate {
  // The entity whose geometry we are updating. Must refer to a link.
  string entity_name = 1;

  enum GeometryType {
    GEOMETRY_TYPE_UNSPECIFIED = 0;
    GEOMETRY_TYPE_VISUAL = 1;
    GEOMETRY_TYPE_COLLISION = 2;
  }

  message GeometryToRemove {
    // The type of geometry to remove. If unspecified, will remove both
    // collision and visual geometries matching 'geometry_name'.
    GeometryType type = 1;

    // The name of the geometry to remove. If unspecified or empty, will remove
    // all geometry of the given type.
    string geometry_name = 2;
  }

  // Geometries to be removed from the link's geometry component. Will be
  // applied before 'geometries_to_set'.
  repeated GeometryToRemove geometries_to_remove = 2;

  // A specification for either updating or creating a geometry with the given
  // name. In other words, the resulting geometry in the geometry component for
  // link will have the properties specified in `geometry`.
  message GeometryToSet {
    // The type of geometry to set. Must be either visual or collision.
    GeometryType type = 1;

    // The geometry's name. May refer to an existing geometry, in which case
    // it will be replaced by that provided in 'geometry'. Required.
    string geometry_name = 2;

    // The geometry to replace for the given name. If left unspecified, it will
    // be treated the same as removing this geometry.
    intrinsic_proto.geometry.v1.TransformedGeometry geometry = 3;
  }

  // Geometries to be added or modified in the link's geometry component. Will
  // applied after 'geometries_to_remove'.
  repeated GeometryToSet geometries_to_set = 3;
}

message ReparentEntityUpdate {
  // The entity to be reparented.
  string entity_name = 1;

  // The new parent entity.
  string new_parent_name = 2;
}

message UpdateFrameProperties {
  // The name of the frame entity being updated.
  string frame_name = 1;

  // The new value for is_attachment_frame.
  optional bool is_attachment_frame = 2;
}

message UpdateSimulationProperties {
  // If set, updates the static property of the object.
  optional bool is_static = 1;

  // If set, updates the disabled property of the object.
  optional bool is_disabled = 2;
}

message UpdatePhysicsProperties {
  // The name of the link entity being updated.
  string entity_name = 1;

  optional double mass_kg = 2;
  optional intrinsic_proto.Pose this_t_center_of_mass = 3;
  optional intrinsic_proto.Matrixd inertia = 4;
  optional intrinsic_proto.world.Friction friction = 5;
  optional intrinsic_proto.world.Torsional torsional = 6;
  optional double contact_kp = 7;
  optional double contact_kd = 8;
  // If set, updates whether the link is kinematic only.
  optional bool kinematic = 9;
}

// Create a new joint entity between existing attached links.
message CreateJointUpdate {
  // Name of the parent link entity.
  string parent_link_name = 1;

  // Name of the child link entity.
  string child_link_name = 2;

  // Name of the new joint entity to be created.
  string new_joint_name = 3;

  // Joint definition for the new joint entity.
  //
  // When inserting a joint between parent_link and child_link, the child link's
  // parent_t_this is set to Identity so downstream tools see the child link
  // anchored directly at the joint.
  //
  // See parent_t_child_policy for how parent_t_inboard and outboard_t_child
  // poses are resolved relative to the existing child link pose.
  Joint joint = 4;

  // Policy for resolving the joint's parent_t_inboard and outboard_t_child
  // poses relative to the child link's existing resting pose
  // (T_{parent_link -> child_link} at q = 0).
  enum ParentTChildPolicy {
    // Unset / default behavior. Same as PARENT_T_CHILD_POLICY_PRESERVE.
    PARENT_T_CHILD_POLICY_UNSPECIFIED = 0;

    // Preserves the child link's existing resting pose relative to parent_link
    // at 0 actuation (T_{parent_link -> child_link}) by computing the
    // unspecified pose:
    // - If only parent_t_inboard is specified:
    //     T_{outboard -> child_link} =
    //         T_{parent_link -> inboard}^-1 * T_{parent_link -> child_link}
    // - If only outboard_t_child is specified:
    //     T_{parent_link -> inboard} =
    //         T_{parent_link -> child_link} * T_{outboard -> child_link}^-1
    // - If neither is specified:
    //     T_{parent_link -> inboard} = T_{parent_link -> child_link}
    //     T_{outboard -> child_link} = Identity
    //
    // Specifying BOTH parent_t_inboard and outboard_t_child when preserving
    // parent_t_child is an error (use PARENT_T_CHILD_POLICY_DO_NOT_PRESERVE
    // instead to specify both poses explicitly).
    PARENT_T_CHILD_POLICY_PRESERVE = 1;

    // Do not preserve the child link's existing resting pose. The
    // parent_t_inboard and outboard_t_child poses are used verbatim as
    // specified (or default to Identity if omitted):
    //   T_{parent_link -> child_link} =
    //       T_{parent_link -> inboard} * T_{outboard -> child_link}
    PARENT_T_CHILD_POLICY_DO_NOT_PRESERVE = 2;
  }

  // Policy for preserving parent_t_child. Defaults to
  // PARENT_T_CHILD_POLICY_PRESERVE when unspecified.
  ParentTChildPolicy parent_t_child_policy = 5;
}
