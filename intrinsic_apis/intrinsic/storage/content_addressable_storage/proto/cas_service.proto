syntax = "proto3";

package intrinsic_proto.content_addressable_storage.v1;

option go_package = "intrinsic/storage/content_addressable_storage/proto/cas_service_go_proto";

service ContentAddressableStorageService {
  // Get an object by its ID.
  rpc Get(GetRequest) returns (stream GetResponse) {}

  // Create an object. After the streaming is finished, the service will return
  // the object ID for it.
  //
  // Notice that we don't support resumable writes!
  rpc Create(stream CreateRequest) returns (CreateResponse) {}

  // Delete an object.
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}

  // Get information about an object, returns the NOT FOUND canonical error if
  // it doesn't exist. Useful for checking if an object already exists. Notice,
  // however, that Stat and {Create, Delete} are not atomic. If Alice stats an
  // object which is being uploaded or deleted by Bob, the result will be
  // obsolete after Bob's operation finishes.
  rpc Stat(StatRequest) returns (StatResponse) {}

  // Get a byte range of an object starting from read_offset until EOF.
  // Useful for resuming interrupted downloads.
  rpc GetRange(GetRangeRequest) returns (stream GetRangeResponse) {}

  // Initialize a resumable upload session. Returns an upload_id to pass to
  // WriteObject and QueryWriteStatus.
  rpc StartResumableWrite(StartResumableWriteRequest)
      returns (StartResumableWriteResponse) {}

  // Stream data chunks to an active resumable upload session.
  rpc WriteObject(stream WriteObjectRequest) returns (WriteObjectResponse) {}

  // Query the server's persisted byte offset and completion status for an
  // upload session.
  rpc QueryWriteStatus(QueryWriteStatusRequest)
      returns (QueryWriteStatusResponse) {}
}

message ChecksummedData {
  bytes content = 1;
  // See https://cloud.google.com/storage/docs/hashes-etags#crc32c.
  optional fixed32 crc32c = 2;
}

message GetRequest {
  string object_id = 1;
}

message GetResponse {
  ChecksummedData checksummed_data = 1;
}

message GetRangeRequest {
  string object_id = 1;

  // Starting byte offset (0-indexed, inclusive). Must be >= 0 and < size of the
  // object. Streams all remaining bytes from read_offset to EOF.
  int64 read_offset = 2;
}

message GetRangeResponse {
  ChecksummedData checksummed_data = 1;

  // The starting byte offset of this specific chunk in the underlying object.
  int64 chunk_offset = 2;

  // Total size of the underlying object in bytes.
  int64 total_object_size = 3;
}

message CreateRequest {
  ChecksummedData checksummed_data = 1;
}

message CreateResponse {
  string object_id = 1;
}

message DeleteRequest {
  string object_id = 1;
}

message DeleteResponse {}

message StatRequest {
  string object_id = 1;

  // Optional. If specified, then up to `peek_bytes` are read from the beginning
  // of the file and returned in the `StatResponse`. This is useful for e.g.
  // checking the file headers.
  //
  // If this number is outside of the valid range (`0 <= peek_bytes < 128`), an
  // `INVALID_ARGUMENT` canonical error is returned. If this number is zero,
  // then reading the file is skipped and no `first_bytes` are returned.
  int32 peek_bytes = 2;
}

message StatResponse {
  // Object size in bytes.
  int64 size = 1;

  // Optional. Set only if the client requested `peek_bytes`.
  bytes first_bytes = 2;
}

message StartResumableWriteRequest {
  // Optional total object size in bytes. If provided, the server validates it
  // against the maximum allowed size upfront and verifies the final size upon
  // `finish_write = true`.
  optional int64 object_size = 1;
}

message StartResumableWriteResponse {
  string upload_id = 1;
}

message WriteObjectRequest {
  // Required on the FIRST message of each WriteObject stream; empty ("") on
  // subsequent messages in the same stream.
  string upload_id = 1;

  // Required on the FIRST message of each WriteObject stream. Must equal the
  // server's `persisted_size` (0 on the initial stream, or the value returned
  // by QueryWriteStatus when resuming).
  // For subsequent messages in the same stream, offsets are implicit (bytes
  // are appended sequentially).
  optional int64 write_offset = 2;

  // Data chunk and its optional CRC32C checksum. May be empty if
  // `finish_write` is true and all bytes were already persisted.
  ChecksummedData checksummed_data = 3;

  // Set to true ONLY on the last message of the final WriteObject stream.
  // Instructs the server to finalize the object, verify `object_size`,
  // move/compose the object into its final CAS key, and return
  // `object_id`.
  bool finish_write = 4;
}

message WriteObjectResponse {
  // Populated ONLY when `finish_write = true` succeeded.
  string object_id = 1;
}

message QueryWriteStatusRequest {
  string upload_id = 1;
}

message QueryWriteStatusResponse {
  // Total number of contiguous bytes from offset 0 that the server has durably
  // persisted so far. The next WriteObject stream must start at
  // `write_offset = persisted_size`.
  int64 persisted_size = 1;

  // Populated ONLY if the upload was already finalized (`finish_write = true`
  // succeeded on a preceding WriteObject stream. Allows a client to get the
  // object_id if the WriteObjectResponse was lost over the network).
  string object_id = 2;
}
