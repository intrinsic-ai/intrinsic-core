syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/geometry/proto/transformed_geometry_storage_refs.proto";
import "intrinsic/geometry/proto/v1/transformed_geometry.proto";
import "intrinsic/world/proto/entity_search.proto"; 
import "intrinsic/world/proto/object_world_refs.proto";

option go_package = "intrinsic/skills/proto/footprint_go_proto";

// A footprint contains zero or more reservations that must be held when
// executing a skill. Each reservation has a sharing type which is used to
// determine when two skills can be scheduled concurrently.
//
// Object reservations and volume reservations are checked independently:
// - Object reservations act as read/write locks on specific world objects and
//   frames. Two skills conflict if they reserve the same object and at least
//   one of them requires write access.
// - Volume reservations define 3D regions of space (e.g. the swept volume of a
//   moving robot, or an exclusion zone) and conflict only with overlapping
//   volume reservations of other skills, according to their sharing types.
//
// A volume reservation does not implicitly reserve the objects it contains or
// overlaps, and it is not checked against static scene geometry (e.g. for
// swept volumes, collision avoidance against the scene is handled during
// motion planning). A skill that needs exclusive access to objects in a region
// must reserve them explicitly in `object_reservation`.
message Footprint {
  // One or more volume reservations.
  repeated VolumeReservation volume = 1;


  // One or more entity reservations. Note that this overlaps with object
  // reservations below and only one needs to be specified. We want to migrate
  // over to using only `object` when skills have been migrated to use the
  // object world. At that point, this field can be deprecated and deleted.
  repeated EntityReservation entity = 2;


  // One or more reservations in the world (objects or frames).
  repeated ObjectWorldReservation object_reservation = 4;

  // One or more resource reservations.
  repeated ResourceReservation resource_reservation = 6;

  // A special value - true indicates that all entities in the entire universe
  // are held, implying that this holder of this footprint cannot execute at
  // the same time as anything else that holds any entity.
  //
  // NOTE: If set, the volume and entity constraints are ignored and every
  // entity is locked with write access.

  // TODO(gregl,keegang): Figure out how to interpret this value in regards to
  // "resting" robots in offline planning

  bool lock_the_universe = 3;

  // By default we will automatically add the extra missing permissions to make
  // this footprint a complete set. This includes read access for all entities
  // in the parent chains of any already specified entities. As well as write
  // access to any children of write enabled entitiees already provided.
  //
  // If set to true, this process will be skipped.
  bool skip_missing_permissions = 5;
}


message EntityReservation {
  enum SharingType {
    // The holder has an exclusive lock on the entities and is free to change
    // their state. For example, a writer lock must be held to control a robot.
    WRITE = 0;

    // The holder has a shared lock on the entities and its state must not
    // change until all reader locks are released.
    READ = 1;
  }

  // The type of reservation lock.
  SharingType type = 1;

  // The entities to apply the specified sharing type.
  intrinsic_proto.world.EntitySearchCriteria entity = 6;

  reserved 2, 3, 4, 5;
  reserved "by_raw_id", "by_alias", "by_label", "universe";
}


message ObjectWorldReservation {
  enum SharingType {
    // The holder has an exclusive lock on this object and is free to change
    // its state. For example, a writer lock must be held to control a robot.
    WRITE = 0;

    // The holder has a shared lock on this object and its state must not
    // change until all reader locks are released.
    READ = 1;
  }

  // The type of reservation lock.
  SharingType type = 1;

  // The object world item to which to apply the specified sharing type.
  oneof object_type {
    // Name of an object.
    intrinsic_proto.world.ObjectReferenceByName object = 2;

    // Name of a frame and its parent object.
    intrinsic_proto.world.FrameReferenceByName frame = 3;
  }
}

message VolumeReservation {
  enum SharingType {
    // The holder is allowed to change the contents of the volume. This is an
    // exclusive lock. For example, a robot moving through a swept volume would
    // need to acquire this type of lock.
    WRITE = 0;


    // The holder requires that this volume remain empty. This lock can be
    // shared by multiple holders. It is also compatible with a STATIC_READ
    // lock. A camera that requires an empty volume between it and the sensed
    // object should acquire this lock.
    EMPTY = 1;

    // A special value assigned for rests. It implies that the volume is held
    // and occupied, but that the planning system can assume that the skill
    // logic will deal with planning around the volume.
    STATIC = 3;

    // The holder owns the specified region but handles collisions with static
    // objects within. This includes the volumes marked "STATIC" as well as any
    // truly static objects in the cell.
    WRITE_ALLOWING_STATIC = 4;

  }

  // The type of volume lock.
  SharingType type = 1;

  // The volume must be expressed using on of the following:
  oneof volume_oneof {
    intrinsic_proto.geometry.TransformedGeometryStorageRefs shape = 4
        [deprecated = true];
    // The TransformedGeometry message for footprint volume reservation. If
    // inline_geometry is provided, it must ONLY contain primitives, not
    // meshes or point clouds.
    intrinsic_proto.geometry.v1.TransformedGeometry transformed_geometry = 6;
  }

  reserved 2, 5;
  reserved "universe", "shape_data";
}

message ResourceReservation {
  enum SharingType {
    // Unspecified sharing type is treated the same as WRITE_NONEXCLUSIVE.
    UNSPECIFIED = 0;
    // The holder requires exclusive access to read and change the state of this
    // resource.
    WRITE = 1;
    // The holder can read but may not change the state of this resource.
    READ = 2;
    // The holder can read and change the state of this resource. It requires
    // exclusive access to change the state, but does not require exclusive
    // access to read it.
    WRITE_EXCLUSIVE_READ_NONEXCLUSIVE = 3;
    // The holder can read and change the state of this resource, but does not
    // require exclusive access to either.
    WRITE_NONEXCLUSIVE = 4;
  }

  // The type of reservation.
  SharingType type = 1;

  // Name of the equipment to be locked.
  string name = 2;
}
