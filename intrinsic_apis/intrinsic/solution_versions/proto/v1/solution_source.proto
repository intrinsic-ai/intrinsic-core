syntax = "proto3";

package intrinsic_proto.solution_versions.v1;

import "intrinsic/assets/proto/v1/solution.proto";
import "intrinsic/solution_versions/proto/v1/snapshot_source.proto";

option go_package = "intrinsic/solution_versions/proto/v1/solution_source_go_proto";

// Where a solution comes from: a stored snapshot, or the request itself.
// This is used to identify a solution when it is one side of a comparison
// (e.g., for diffing).
message SolutionSource {
  oneof source {
    // A snapshot stored by the service.
    SnapshotSource snapshot = 1;

    // A solution supplied by the caller, for example one that was built
    // locally and never stored.
    intrinsic_proto.assets.v1.Solution solution = 2;
  }
}
