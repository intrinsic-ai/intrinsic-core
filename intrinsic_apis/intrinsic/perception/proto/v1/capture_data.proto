syntax = "proto3";

package intrinsic_proto.perception.v1;

import "intrinsic/math/proto/pose.proto";
import "intrinsic/platform/pubsub/storage_location.proto";

option go_package = "intrinsic/perception/proto/v1/capture_data_go_proto";

// A container for the data returned by the CaptureImages skill.
message CaptureData {
  kvstore.StorageLocation capture_result_location = 1;
  Pose world_t_camera = 2;
  // Optional transform from the camera frame to the reference frame
  // (reference_t_camera, i.e. the pose of the camera in the reference frame).
  // If reference_frame is not specified, this field is not set.
  optional Pose reference_t_camera = 3;
}

// A list of `CaptureData`, e.g. the outputs of several CaptureImages skills.
message CaptureDataList {
  repeated intrinsic_proto.perception.v1.CaptureData capture_data = 1;
}
