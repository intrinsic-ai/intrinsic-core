syntax = "proto3";

package intrinsic_proto.solution_versions.v1alpha1;

option go_package = "intrinsic/solution_versions/proto/v1alpha1/motion_planner_service_migration_go_proto";

// MotionPlannerServiceMigration configures the migration that installs the
// Motion Planner Service Asset (ai.intrinsic.motion_planner_service) and sets
// it as the Motion Planner Service dependency of each motion planning Skill
// parameter that does not have one.
message MotionPlannerServiceMigration {
  // Target version of the Motion Planner Service Asset
  // (ai.intrinsic.motion_planner_service) to install (for example, "1.0.0"). If
  // omitted or empty, the server dynamically resolves the default version from
  // the Asset Catalog.
  string target_version = 1;
}
