  // Each object is referenced either by ID or name, and each world is
  // referenced by its world ID

  // Returns a single object.
  rpc GetObject(GetObjectRequest) returns (Object) {
    // Auth annotations for consumption by the following helm_chart:
    //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
    option (intrinsic_proto.auth.method_options).auth_methods =
        AUTH_METHOD_API_KEY;
    option (google.api.http) = {
      get: "/world/v0/worlds/{world_id}/objects/{object.id}"
