  // Lists objects in a world, including the root object.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse) {
    // Auth annotations for consumption by the following helm_chart:
    //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
    option (intrinsic_proto.auth.method_options).auth_methods =
        AUTH_METHOD_API_KEY;
    option (google.api.http) = {
      get: "/world/v0/worlds/{world_id}/objects"
    };
  }

  // Creates a new object.
  rpc CreateObject(CreateObjectRequest) returns (Object) {
    // Auth annotations for consumption by the following helm_chart:
    //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
    option (intrinsic_proto.auth.method_options).auth_methods =
        AUTH_METHOD_API_KEY;
    option (google.api.http) = {
      post: "/world/v0/worlds/{world_id}/objects"
      body: "*"
    };
  }

  // Deletes an object in the world.
  rpc DeleteObject(DeleteObjectRequest) returns (google.protobuf.Empty) {
    // Auth annotations for consumption by the following helm_chart:
    //   cs/symbol://intrinsic/kubernetes/api_relay/cloud:api-relay
    option (intrinsic_proto.auth.method_options).auth_methods =
