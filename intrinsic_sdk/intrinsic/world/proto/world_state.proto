syntax = "proto3";

package intrinsic_proto.world;

import "intrinsic/math/proto/pose.proto";
import "intrinsic/world/proto/object_world_service.proto";

option go_package = "intrinsic/world/proto/world_state_go_proto";

// The pose of an entity relative to its parent.
message EntityPose {
  // The id of the entity.
  uint32 entity_id = 1;

  // Pose of the entity in its parent's space.
  intrinsic_proto.Pose parent_t_this = 2;
}

// The joint positions of a kinematic object.
message KinematicObjectJoints {
  // The id of the kinematic object.
  string object_id = 1;

  // Joint positions in radians (for revolute joints) or meters (for prismatic
  // joints).
  repeated double joint_positions = 2;
}

// A snapshot of the dynamic state of a world: the poses of its entities and the
// joint positions of its kinematic objects. It doesn't describe the structure
// of the world (e.g. its objects and their components); clients detect
// structural changes through `world_metadata.world_structure_hash`.
//
// The ObjectWorldService publishes this message whenever the state of a world
// changes.
message WorldStateUpdate {
  // Metadata of the world.
  intrinsic_proto.world.WorldMetadata world_metadata = 1;

  // The poses of the entities in the world.
  repeated EntityPose entity_poses = 2;

  // The joint positions of the kinematic objects in the world.
  repeated KinematicObjectJoints kinematic_object_joints = 3;
}
